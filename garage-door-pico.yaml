# Raspberry Pi Pico W Garage Door Sensor
# https://github.com/geerlingguy/pico-w-garage-door-sensor

substitutions:
  name: garage-door-pico
  friendly_name: Garage-Door pico

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

rp2040:
  board: rpipicow

# Enable logging
logger:
  level: WARN

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key01

# Enable over-the-air updates.
ota:
  platform: esphome
  password: !secret ota_password01

safe_mode:
  disabled: false
  reboot_timeout: 10min
  num_attempts: 5

# Connect to WiFi.
wifi:
  fast_connect: true
  networks:
    - ssid: !secret "wifi_ssid1"
      password: !secret "wifi_password1"

# Enable fallback hotspot in case wifi connection fails (takes up unnessecary RAM)
#ap:
#  ssid: ${friendly_name}
#  password: !secret wifi_hotspot_password

# Enable Web server. Not yet supported on Pico.
#web_server:
#  port: 80

# Sync time with Home Assistant.
time:
  - platform: homeassistant
    id: homeassistant_time

# ----------------------------
# Binary Sensors
# ----------------------------
binary_sensor:
  # East Garage Door
  - platform: gpio
    pin:
      number: 3
      mode:
        input: true
        pullup: true
    name: East Garage Door
    id: east_garage_door
    device_class: garage_door
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms

  # West Garage Door
  - platform: gpio
    pin:
      number: 2
      mode:
        input: true
        pullup: true
    name: West Garage Door
    id: west_garage_door
    device_class: garage_door
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms

  - platform: status
    name: "${friendly_name} Status"
