# Raspberry Pi Pico W Garage Door Sensor
# https://github.com/geerlingguy/pico-w-garage-door-sensor

substitutions:
  name: garage-door-pico
  friendly_name: Garage-Door pico

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

rp2040:
  board: rpipicow

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key01

# Enable over-the-air updates.
ota:
  platform: esphome
  password: !secret ota_password01

safe_mode:
  disabled: false
  reboot_timeout: 10min
  num_attempts: 5

# Connect to WiFi.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot in case wifi connection fails
  ap:
    ssid: ${friendly_name}
    password: !secret wifi_hotspot_password

# Enable Web server. Not yet supported on Pico.
#web_server:
#  port: 80

# Sync time with Home Assistant.
time:
  - platform: homeassistant
    id: homeassistant_time

# LED on when door open.
output:
  # Built-in LED
  - platform: gpio
    pin:
      number: 32  # 25 for Pico (non-W)
      mode: output
    id: LED

# Binary sensor representing the
# garage-door status for each door. 
binary_sensor:
  # Tesla Garage Door
  - platform: gpio
    pin:
      number: 3
      mode:
        input: true
        pullup: true
        output: false
        open_drain: false
        pulldown: false
      inverted: false
    name: Tesla Garage Door
    id: tesla_garage_door
    device_class: door
    filters:
      - delayed_on: 10ms
    disabled_by_default: false
    on_state:
      then:
        - if:
            condition:
              or:
                - binary_sensor.is_on: tesla_garage_door
                - binary_sensor.is_on: cadi_garage_door
            then:
              - output.turn_on: LED
            else:
              - output.turn_off: LED

  # Cadi Garage Door
  - platform: gpio
    pin:
      number: 2
      mode:
        input: true
        pullup: true
        output: false
        open_drain: false
        pulldown: false
      inverted: false
    name: Cadi Garage Door
    id: cadi_garage_door
    device_class: door
    filters:
      - delayed_on: 10ms
    disabled_by_default: false
    on_state:
      then:
        - if:
            condition:
              or:
                - binary_sensor.is_on: tesla_garage_door
                - binary_sensor.is_on: cadi_garage_door
            then:
              - output.turn_on: LED
            else:
              - output.turn_off: LED
